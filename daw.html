<!doctype html>
<html><head><meta charset="utf-8"><title>PIXELDAW</title>
<style>
@font-face { font-family:'Minecraft'; src:url('assets/Minecraft.ttf') format('truetype'); }
:root { --bg:#171a21; --panel:#1b2838; --ink:#c7d5e0; --dim:#8f98a0; --acc:#f0a500; --acc2:#66c0f4; }
* { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink);
  font:13px 'Minecraft','Cascadia Code',Consolas,monospace; }
header { display:flex; gap:10px; align-items:center; padding:8px 12px; background:var(--panel);
  border-bottom:1px solid #000000; flex-wrap:wrap; }
h1 { font-size:15px; margin:0 12px 0 0; color:var(--acc); }
button { background:#2a475e; color:var(--ink); border:1px solid #0d1319; border-radius:5px;
  padding:5px 12px; cursor:pointer; font:inherit; }
button:hover { border-color:var(--acc); } button.on { background:var(--acc); color:#10202a; }
select,input[type=number] { background:#2a475e; color:var(--ink); border:1px solid #0d1319;
  border-radius:4px; padding:3px 6px; font:inherit; width:auto; }
input[type=number] { width:62px; }
#tabs { display:flex; gap:4px; padding:6px 12px; background:#10151d; }
#tabs button { padding:4px 10px; font-size:12px; }
main { display:flex; height:calc(100vh - 96px); }
#tracks { width:270px; overflow-y:auto; background:var(--panel); border-right:1px solid #000000; }
.trk { padding:8px 10px; border-bottom:1px solid #22303c; cursor:pointer; }
.trk.sel { background:#2a475e; border-left:3px solid var(--acc); }
.trk .nm { font-weight:bold; margin-bottom:4px; } .trk .row { display:flex; gap:5px; margin:3px 0;
  align-items:center; font-size:11px; color:var(--dim); flex-wrap:wrap; }
#rollwrap { flex:1; overflow:auto; position:relative; }
canvas { display:block; image-rendering:pixelated; }
#playhead { position:absolute; top:0; left:0; width:2px; background:var(--acc);
  box-shadow:0 0 6px var(--acc); display:none; pointer-events:none; z-index:5; }
#status { padding:5px 12px; color:var(--dim); font-size:12px; background:#10151d;
  border-top:1px solid #000000; white-space:pre-wrap; }
label { color:var(--dim); font-size:11px; }

#renderov { position:fixed; inset:0; z-index:400; background:rgba(13,16,22,.9);
  display:none; align-items:center; justify-content:center; flex-direction:column; gap:18px; }
#renderov.show { display:flex; }
#renderov img { width:64px; image-rendering:pixelated; animation:rospin 1.6s linear infinite; }
@keyframes rospin { to { transform:rotateY(360deg); } }
#renderov .rmsg { color:var(--ink); font-size:15px; letter-spacing:1px; }
#renderov .rbarwrap { width:min(420px,80vw); height:18px; background:#10151d;
  border:2px solid #000; }
#renderov .rbar { height:100%; width:0%; background:linear-gradient(180deg,#ffd166,var(--acc));
  transition:width .3s linear; }
#renderov .rhint { color:var(--dim); font-size:11px; }
</style></head><body>
<div id="renderov"><img src="assets/icon_heart.png" alt="">
  <div class="rmsg" id="rmsg">RENDERING&hellip;</div>
  <div class="rbarwrap"><div class="rbar" id="rbar"></div></div>
  <div class="rhint">bouncing every note through the synth &mdash; long movements take a couple of minutes</div>
</div>
<header>
  <a href="index.html" title="back to PIXELFALL"><img src="assets/icon_heart.png" style="height:26px;display:block;image-rendering:pixelated"></a>
  <h1>PIXELDAW</h1>
  <button id="play">&#9654; Play</button>
  <button id="stop">&#9632; Stop</button>
  <button id="zout" title="zoom out (Ctrl+scroll)">&#128269;&minus;</button>
  <button id="zin" title="zoom in (Ctrl+scroll)">&#128269;+</button>
  <label><input type="checkbox" id="loop" checked> loop</label>
  <label>from bar <input type="number" id="frombar" value="1" min="1" max="99"
    oninput="playStartBeat=(Math.max(1,parseInt(this.value||1))-1)*4; draw();"></label>
  <label title="tempo of the CURRENT song">BPM <input type="number" id="bpm" value="96" min="40" max="220"
    oninput="if(score&&score.movements[mvi]) score.movements[mvi].bpm=parseFloat(this.value)||96;"></label>
  <label>note len <select id="nlen"><option>0.25</option><option>0.5</option><option selected>1</option>
    <option>1.5</option><option>2</option><option>3</option><option>4</option></select> beats</label>
  <label>velocity <input type="number" id="nvel" value="0.8" min="0.05" max="1" step="0.05"></label>
  <button id="idesign">&#9881; Instruments</button>
  <button id="exwav" title="render this movement to a .wav you can keep">Export WAV</button>
  <button id="exmid" title="this movement as a standard .mid - open it in any DAW">Export MIDI</button>
  <button id="exjson" title="the whole score, every movement, as JSON">Export Score</button>
  <span style="margin-left:auto;font-size:11px;color:var(--dim)">the real tool the suite was written in &mdash; play, zoom, add notes; edits stay in your browser &middot; <a href="index.html" style="color:var(--acc);text-decoration:none">&larr; pixelfall.net</a></span>
</header>
<div id="ipanel" style="display:none; padding:8px 12px; background:#10151d; border-bottom:1px solid #000000;">
  <div class="row" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
    <label>edit <select id="ci_pick"><option value="">— new —</option></select></label>
    <label>name <input id="ci_name" style="width:110px;background:#2a475e;color:var(--ink);border:1px solid #0d1319;border-radius:4px;padding:3px 6px;font:inherit;"></label>
    <label>wave <select id="ci_wave"><option>square</option><option>pulse25</option><option>pulse125</option>
      <option>triangle</option><option>saw</option><option>sine</option></select></label>
    <label>atk <input type="number" id="ci_atk" value="0.005" step="0.005" min="0"></label>
    <label>dec <input type="number" id="ci_dec" value="0.5" step="0.05" min="0.01"></label>
    <label>sus <input type="number" id="ci_sus" value="0" step="0.05" min="0" max="1"></label>
    <label>rel <input type="number" id="ci_rel" value="0.2" step="0.05" min="0.01"></label>
    <label>lowpass <input type="number" id="ci_lp" value="0" step="100" min="0"></label>
    <label>crush <input type="number" id="ci_cr" value="0" step="2" min="0" max="64"></label>
  </div>
  <div class="row" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px;">
    <label>vib rate <input type="number" id="ci_vr" value="0" step="0.5" min="0"></label>
    <label>depth% <input type="number" id="ci_vd" value="0" step="0.1" min="0"></label>
    <label>delay <input type="number" id="ci_vy" value="0.1" step="0.05" min="0"></label>
    <label>| fm ratio <input type="number" id="ci_fr" value="2" step="0.5" min="0.5"></label>
    <label>index <input type="number" id="ci_fi" value="0" step="0.2" min="0"></label>
    <label>fm dec <input type="number" id="ci_fd" value="5" step="0.5" min="0.5"></label>
    <label>| partial1 x<input type="number" id="ci_p1m" value="2" step="0.01" min="1"></label>
    <label>lvl <input type="number" id="ci_p1l" value="0" step="0.05" min="0"></label>
    <label>x2 <input type="number" id="ci_p2m" value="3" step="0.01" min="1"></label>
    <label>lvl <input type="number" id="ci_p2l" value="0" step="0.05" min="0"></label>
    <button id="ci_test">Test</button>
    <button id="ci_save">Save instrument</button>
  </div>
</div>
<div id="tabs"></div>
<main>
  <div id="tracks"></div>
  <div id="rollwrap"><canvas id="roll"></canvas><div id="playhead"></div></div>
</main>
<div id="status">loading score.json…</div>
<script>
'use strict';
const INSTRUMENTS = ['pulse125','pulse25','square50','pluck25','pluck50','triangle',
                     'chipsine','harp','piano','bell','sinebass','noise',
                     'n64_epiano','n64_flute','n64_strings','n64_guitar',
                     'n64_bell','n64_bass','n64_marimba'];
const COLORS = ['#dfc482','#5db5f0','#ff7a45','#8fce6a','#badef0','#ffaa32','#f2f7f9','#9fb0c0','#b58fd8'];
let score = null, mvi = 0, tri = 0, ac = null, playing = false, playTimer = null;
const $ = id => document.getElementById(id);
const status = m => $('status').textContent = m;

fetch('assets/score.json').then(r => r.json()).then(s => { score = s; $('bpm').value = s.bpm || 96;
  buildTabs(); buildTracks(); draw(); status('ready — click roll to add/remove notes on the selected track'); })
  .catch(e => status('no score: run  py tools/export_seed_score.py   (' + e + ')'));

function mv() { return score.movements[mvi]; }
function trk() { return mv().tracks[tri]; }

function buildTabs() {
  const t = $('tabs'); t.innerHTML = '';
  const lab = document.createElement('label');
  lab.textContent = 'song ';
  lab.style.cssText = 'color:var(--dim);font-size:12px;';
  const sl = document.createElement('select');
  sl.style.cssText = 'font-size:13px;padding:4px 8px;max-width:420px;';
  score.movements.forEach((m, i) => {
    const o = document.createElement('option');
    const n = m.tracks.reduce((a, tr) => a + tr.notes.length, 0);
    o.value = i;
    o.textContent = `${m.name}  —  ${m.bars} bars, ${n} notes`;
    if (i === mvi) o.selected = true;
    sl.appendChild(o);
  });
  sl.onchange = () => { mvi = parseInt(sl.value, 10); tri = 0; sel.clear();
                        $('bpm').value = mv().bpm || score.bpm;
                        buildTabs(); buildTracks(); draw(); };
  lab.appendChild(sl);
  t.appendChild(lab);
}
function buildTracks() {
  const el = $('tracks'); el.innerHTML = '';
  mv().tracks.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'trk' + (i === tri ? ' sel' : '');
    d.style.borderLeftColor = COLORS[i % COLORS.length];
    const allInst = INSTRUMENTS.concat(Object.keys(score.customInstruments || {}));
    const inst = allInst.map(x =>
      `<option${x === t.instrument ? ' selected' : ''}>${x}</option>`).join('')
      + '<option value="__new__">＋ new instrument…</option>';
    d.innerHTML = `<div class="nm" style="color:${COLORS[i % COLORS.length]}" title="double-click to rename">${t.name}
        <span style="float:right;color:var(--dim)">${t.notes.length}n
        <span class="trkdel" style="cursor:pointer;color:#ff6b8a;margin-left:6px;" title="delete track">&times;</span></span></div>
      <div class="row">inst <select data-k="instrument">${inst}</select>
        <label><input type="checkbox" data-k="mute"${t.mute ? ' checked' : ''}>mute</label>
        <label><input type="checkbox" data-k="dry"${t.dry ? ' checked' : ''}>dry</label></div>
      <div class="row">gain <input type="number" data-k="gain" value="${t.gain ?? 1}" step="0.05" min="0" max="3">
        oct <input type="number" data-k="octave" value="${t.octave ?? 0}" step="1" min="-3" max="3">
        pan <input type="number" data-k="pan" value="${t.pan ?? 0.5}" step="0.05" min="0" max="1"></div>`;
    d.onclick = e => { if (e.target.dataset.k) return; tri = i; sel.clear(); buildTracks(); draw(); };
    d.querySelectorAll('[data-k]').forEach(inp => {
      const apply = () => {           // oninput = LIVE while spinning/dragging
        const k = inp.dataset.k;
        if (k === 'instrument' && inp.value === '__new__') {
          inp.value = t.instrument;   // don't leave the select on "+ new"
          openDesignerFor(i);         // designer opens wired to THIS track
          return;
        }
        t[k] = inp.type === 'checkbox' ? inp.checked : (k === 'instrument' ? inp.value : parseFloat(inp.value));
        draw();
      };
      inp.oninput = apply; inp.onchange = apply;
    });
    d.querySelector('.nm').ondblclick = () => {
      const nm = prompt('Track name', t.name);
      if (nm) { t.name = nm; buildTracks(); }
    };
    d.querySelector('.trkdel').onclick = e => {
      e.stopPropagation();
      if (t.notes.length && !confirm(`Delete track "${t.name}" (${t.notes.length} notes)?`)) return;
      mv().tracks.splice(i, 1);
      tri = Math.max(0, Math.min(tri, mv().tracks.length - 1));
      sel.clear(); buildTracks(); draw();
    };
    el.appendChild(d);
  });
  // ＋ ADD TRACK: aggregate a new arrangement line into this movement
  const addBtn = document.createElement('button');
  addBtn.textContent = '＋ add track';
  addBtn.style.cssText = 'margin:10px; width:calc(100% - 20px);';
  addBtn.onclick = () => {
    const m = mv();
    m.tracks.push({ name: 'Track ' + (m.tracks.length + 1), instrument: 'square50',
                    gain: 1.0, octave: 0, pan: 0.5, notes: [] });
    tri = m.tracks.length - 1;
    sel.clear(); buildTracks(); draw();
    status(`track added to ${m.name} — pick an instrument (or ＋ new instrument…) and draw notes`);
  };
  el.appendChild(addBtn);
}

// ── piano roll ───────────────────────────────────────────────
const LOW = 21, HIGH = 108;   // the full 88 keys: A0 .. C8
let CW = 9, RH = 8;                          // 16th cell width, semitone row height (zoomable)
function setZoom(f, viewOffPx) {
  const wrap = $('rollwrap');
  const off = viewOffPx ?? wrap.clientWidth / 2;      // px from viewport left
  const beatAt = (wrap.scrollLeft + off) / (4 * CW);  // beat under that point
  CW = Math.max(2, Math.min(24, CW * f));
  RH = Math.max(4, Math.min(13, Math.round(8 * Math.max(CW / 9, 0.55))));
  draw();
  wrap.scrollLeft = Math.max(0, beatAt * 4 * CW - off);
  $('playhead').style.height = roll.height + 'px';
}
const roll = $('roll'), ctx2 = roll.getContext('2d');
const RULER = 20;                            // bar ruler strip height (px)
let playStartBeat = 0;                       // where Play begins (set on ruler)
function beats() { return (mv().bars || 50) * 4; }
function draw() {
  const W = beats() * 4 * CW, H = RULER + (HIGH - LOW + 1) * RH;
  roll.width = W; roll.height = H;
  ctx2.fillStyle = '#171a21'; ctx2.fillRect(0, 0, W, H);
  for (let m = LOW; m <= HIGH; m++) {
    const y = RULER + (HIGH - m) * RH;
    const pc = ((m % 12) + 12) % 12;
    if ([1,3,6,8,10].includes(pc)) { ctx2.fillStyle = '#10151d'; ctx2.fillRect(0, y, W, RH); }
    if (pc === 0) {
      ctx2.fillStyle = '#2a475e'; ctx2.fillRect(0, y + RH - 1, W, 1);
      // octave label stamped every 8 bars so it's always in view
      ctx2.fillStyle = '#5a6b7a'; ctx2.font = '9px Minecraft, monospace';
      const lab = 'C' + (m / 12 - 1);
      for (let b = 0; b <= beats(); b += 32)
        ctx2.fillText(lab, b * 4 * CW + 3, y + RH - 2);
    }
  }
  for (let b = 0; b <= beats(); b++) {
    ctx2.fillStyle = b % 16 === 0 ? '#0d1319' : (b % 4 === 0 ? '#2a475e' : '#1b2838');
    ctx2.fillRect(b * 4 * CW, RULER, 1, H - RULER);
  }
  // ruler: bar numbers + click-to-set play start
  ctx2.fillStyle = '#10151d'; ctx2.fillRect(0, 0, W, RULER);
  ctx2.fillStyle = '#2a475e'; ctx2.fillRect(0, RULER - 1, W, 1);
  ctx2.fillStyle = '#8f98a0'; ctx2.font = '10px Minecraft, monospace';
  for (let bar = 0; bar * 4 <= beats(); bar += (CW < 5 ? 4 : 1)) {
    ctx2.fillRect(bar * 16 * CW, 0, 1, RULER);
    ctx2.fillText(bar + 1, bar * 16 * CW + 3, 13);
  }
  // play-start marker: flag + dashed drop line
  const px0 = playStartBeat * 4 * CW;
  ctx2.fillStyle = '#f0a500';
  ctx2.beginPath(); ctx2.moveTo(px0, 0); ctx2.lineTo(px0 + 9, 0);
  ctx2.lineTo(px0, 12); ctx2.closePath(); ctx2.fill();
  ctx2.strokeStyle = 'rgba(240,165,0,0.45)'; ctx2.setLineDash([3, 4]);
  ctx2.beginPath(); ctx2.moveTo(px0 + 0.5, RULER); ctx2.lineTo(px0 + 0.5, H); ctx2.stroke();
  ctx2.setLineDash([]);
  mv().tracks.forEach((t, i) => {
    if (t.mute) return;
    const col = COLORS[i % COLORS.length];
    ctx2.globalAlpha = i === tri ? 1.0 : 0.30;
    t.notes.forEach(n => {
      const x = n.b * 4 * CW, y = RULER + (HIGH - (n.m + (t.octave || 0) * 12)) * RH;
      const w = Math.max(n.d * 4 * CW - 1, 3);
      ctx2.fillStyle = col;
      ctx2.fillRect(x, y + 1, w, RH - 2);
      ctx2.fillStyle = '#00000055';
      ctx2.fillRect(x, y + 1, 2, RH - 2);
      if (i === tri && sel.has(n)) {
        ctx2.strokeStyle = '#ffffff'; ctx2.lineWidth = 1.5;
        ctx2.strokeRect(x - 0.5, y + 0.5, w + 1, RH - 1);
      }
    });
  });
  ctx2.globalAlpha = 1.0;
  if (marq && marq.active) {
    const x0 = Math.min(marq.b0, marq.b1) * 4 * CW, x1 = Math.max(marq.b0, marq.b1) * 4 * CW;
    const y0 = RULER + (HIGH - Math.max(marq.m0, marq.m1)) * RH,
          y1 = RULER + (HIGH - Math.min(marq.m0, marq.m1) + 1) * RH;
    ctx2.fillStyle = 'rgba(240,165,0,0.10)';
    ctx2.fillRect(x0, y0, x1 - x0, y1 - y0);
    ctx2.strokeStyle = 'rgba(240,165,0,0.7)'; ctx2.lineWidth = 1;
    ctx2.strokeRect(x0 + 0.5, y0 + 0.5, x1 - x0, y1 - y0);
  }
}
// ── note editing ──────────────────────────────────────────────────────────
// empty space:  stationary click = add note (or clear selection if one is
//               active); CLICK + HOLD + DRAG = marquee-select an area.
// on a note:    stationary click = delete; hold + drag = move (the whole
//               selection moves together if the note is selected).
let drag = null, marq = null, sel = new Set();
let clip = null, hoverBx = 0;      // MIDI clipboard + last roll mouse beat
roll.addEventListener('mousemove', e => {
  const p = rollPos(e); hoverBx = p.bx;
  if (drag || marq) return;
  const t = trk(), oct = (t.octave || 0) * 12;
  const h = t && t.notes.find(n => (n.m + oct) === p.m && p.bx >= n.b && p.bx < n.b + n.d);
  const edge = 6 / (4 * CW);
  roll.style.cursor = (h && h.d > 0.25 &&
    (p.bx > h.b + h.d - edge || p.bx < h.b + edge)) ? 'ew-resize' : '';
});
$('zin').onclick = () => setZoom(1.3);
$('zout').onclick = () => setZoom(1 / 1.3);
$('rollwrap').addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  setZoom(e.deltaY < 0 ? 1.2 : 1 / 1.2,
          e.clientX - $('rollwrap').getBoundingClientRect().left);
}, { passive: false });
function rollPos(e) {
  const r = roll.getBoundingClientRect();
  const rawY = e.clientY - r.top;
  return { bx: (e.clientX - r.left) / (4 * CW),
           rawY,
           m: HIGH - Math.floor((rawY - RULER) / RH) };
}
let rulerDrag = false, panDrag = null;
function setPlayStart(bx) {
  playStartBeat = Math.max(0, Math.min(Math.round(bx), beats() - 1));
  $('frombar').value = Math.floor(playStartBeat / 4) + 1;
  draw();
}
roll.onmousedown = e => {
  e.preventDefault();
  const { bx, m, rawY } = rollPos(e);
  if (e.button === 1) {                     // middle mouse: pan the roll
    const w = $('rollwrap');
    panDrag = { x: e.clientX, y: e.clientY, sl: w.scrollLeft, st: w.scrollTop };
    return;
  }
  if (rawY < RULER) {                       // ruler: set the play start
    rulerDrag = true; setPlayStart(bx);
    return;
  }
  const t = trk(), oct = (t.octave || 0) * 12;
  const hit = t.notes.find(n => (n.m + oct) === m && bx >= n.b && bx < n.b + n.d);
  if (hit) {
    if (e.altKey) {                        // ALT+CLICK: cut the note in two
      const cut = Math.round(bx * 4) / 4;
      if (cut > hit.b && cut < hit.b + hit.d) {
        const tail = { b: cut, m: hit.m, d: hit.b + hit.d - cut, v: hit.v };
        hit.d = cut - hit.b;
        t.notes.push(tail);
        t.notes.sort((a, b2) => a.b - b2.b);
        buildTracks(); draw();
        status('note cut in two — drag either half');
      }
      return;
    }
    const edge = 6 / (4 * CW);             // ~6px grab zone, zoom-aware
    let mode = 'move';
    if (bx > hit.b + hit.d - edge && hit.d > 0.25) mode = 'r';
    else if (bx < hit.b + edge && hit.d > 0.25) mode = 'l';
    const group = (mode === 'move' && sel.has(hit)) ? [...sel] : [hit];
    if (!sel.has(hit)) sel.clear();
    drag = { mode, group: group.map(n => ({ n, ob: n.b, om: n.m })),
             anchor: hit, endB: hit.b + hit.d, bx0: bx, m0: m, moved: false };
  } else {
    marq = { b0: bx, m0: m, b1: bx, m1: m, active: false };
  }
  draw();
};
window.addEventListener('mousemove', e => {
  if (panDrag) {
    const w = $('rollwrap');
    w.scrollLeft = panDrag.sl - (e.clientX - panDrag.x);
    w.scrollTop = panDrag.st - (e.clientY - panDrag.y);
    return;
  }
  const p = rollPos(e);
  if (rulerDrag) { setPlayStart(p.bx); return; }
  if (marq) {
    marq.b1 = p.bx; marq.m1 = p.m;
    if (Math.abs(marq.b1 - marq.b0) > 0.12 || Math.abs(marq.m1 - marq.m0) >= 1)
      marq.active = true;
    if (marq.active) draw();
    return;
  }
  if (!drag) return;
  const t = trk(), oct = (t.octave || 0) * 12;
  if (drag.mode === 'r') {                 // RESIZE from the right edge
    const nd = Math.max(0.25, Math.min(Math.round((p.bx - drag.anchor.b) * 4) / 4,
                                       beats() - drag.anchor.b));
    if (nd !== drag.anchor.d) { drag.anchor.d = nd; drag.moved = true; draw(); }
    return;
  }
  if (drag.mode === 'l') {                 // TRIM from the left edge
    const nb = Math.max(0, Math.min(Math.round(p.bx * 4) / 4, drag.endB - 0.25));
    if (nb !== drag.anchor.b) {

  m.tracks.forEach((t, ti) => {
    let ch = ti % 16; if (ch === 9) ch = 15;      // dodge the GM drum channel
    const ev = [];
    const nm = Array.from(new TextEncoder().encode((t.name || 'track ' + (ti + 1)).slice(0, 60)));
    ev.push({ tick: 0, bytes: [0xFF, 0x03, ...vlq(nm.length), ...nm] });
    t.notes.forEach(n => {
      const p = Math.max(0, Math.min(127, Math.round(n.m + (t.octave || 0) * 12)));
      const v = Math.max(1, Math.min(127, Math.round((n.v == null ? 0.8 : n.v) * 127)));
      ev.push({ tick: Math.round(n.b * PPQ), bytes: [0x90 | ch, p, v] });
      ev.push({ tick: Math.round((n.b + n.d) * PPQ), bytes: [0x80 | ch, p, 0] });
    });
    ev.sort((a, b) => a.tick - b.tick);
    const out = []; let last = 0;
    ev.forEach(e => { out.push(...vlq(e.tick - last), ...e.bytes); last = e.tick; });
    out.push(0, 0xFF, 0x2F, 0x00);
    chunks.push(trk(out));
  });
  const ntrk = 1 + m.tracks.length;
  const bytes = [0x4D, 0x54, 0x68, 0x64, 0, 0, 0, 6, 0, 1,
                 (ntrk >> 8) & 255, ntrk & 255, (PPQ >> 8) & 255, PPQ & 255];
  chunks.forEach(c => { for (const b of c) bytes.push(b); });
  dlBlob('pixelfall_' + safeName(m.name) + '.mid',
    new Blob([new Uint8Array(bytes)], { type: 'audio/midi' }));
  status('"' + (m.name || 'movement') + '" exported as MIDI - open it in any DAW.');
};

function wavBlob(buf) {
  const n = buf.length, ch = 2, sr = buf.sampleRate, total = 44 + n * ch * 2;
  const ab = new ArrayBuffer(total), v = new DataView(ab);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, total - 8, true); w(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * ch * 2, true);
  v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * ch * 2, true);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let o = 44;
  for (let i = 0; i < n; i++) {
    v.setInt16(o, Math.max(-1, Math.min(1, L[i])) * 0x7FFF, true); o += 2;
    v.setInt16(o, Math.max(-1, Math.min(1, R[i])) * 0x7FFF, true); o += 2;
  }
  return new Blob([ab], { type: 'audio/wav' });
}

$('exwav').onclick = async () => {
  const m = mv(); if (!m) return;
  const btn = $('exwav');
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    m.bpm = parseFloat($('bpm').value) || m.bpm || score.bpm || 96;
    const spb = 60 / m.bpm;
    const secs = (m.bars || 50) * 4 * spb + 2.5;
    status('rendering "' + (m.name || 'movement') + '" offline... (' + Math.round(secs) + 's of audio)');
    const rov = document.getElementById('renderov'), rbar = document.getElementById('rbar'),
          rmsg = document.getElementById('rmsg');
    rov.classList.add('show'); rbar.style.width = '0%';
    rmsg.textContent = 'RENDERING “' + (m.name || 'movement').toUpperCase() + '” — 0%';
    const oc = new OfflineAudioContext(2, Math.ceil(secs * 44100), 44100);
    // real progress: suspend checkpoints every ~1% of the timeline
    const stepS = Math.max(0.5, secs / 100);
    for (let tS = stepS; tS < secs; tS += stepS) {
      oc.suspend(tS).then(() => {
        const pct = Math.min(99, Math.round(tS / secs * 100));
        rbar.style.width = pct + '%';
        rmsg.textContent = 'RENDERING “' + (m.name || 'movement').toUpperCase() + '” — ' + pct + '%';
        oc.resume();
      }).catch(() => {});
    }
    const verb = makeReverb(oc);
    // the exact live mixer chain, rebuilt offline: voice -> gain -> pan -> out + send
    m.tracks.forEach(t => {
      if (t.mute) return;
      const g = oc.createGain(), p = oc.createStereoPanner(), snd = oc.createGain();
      g.connect(p); p.connect(oc.destination); p.connect(snd); snd.connect(verb);
      g.gain.value = t.gain == null ? 1 : t.gain;
      p.pan.value = ((t.pan == null ? 0.5 : t.pan) - 0.5) * 1.6;
      snd.gain.value = t.dry ? 0.10 : 0.30;
      t.notes.forEach(n => voice(oc, g, t.instrument,
        midiHz(n.m + (t.octave || 0) * 12), n.d * spb,
        (n.v || 0.8) * 0.10, 0.1 + n.b * spb));
    });
    const buf = await oc.startRendering();
    rbar.style.width = '100%';
    dlBlob('pixelfall_' + safeName(m.name) + '.wav', wavBlob(buf));
    status('WAV exported - your mix of "' + (m.name || 'movement') + '", mutes and edits included.');
  } catch (err) {
    status('render failed: ' + err.message);
  } finally {
    btn.disabled = false;
    document.getElementById('renderov').classList.remove('show');
  }
};
